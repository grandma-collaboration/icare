name: Test documentation build

on:
  push:
    paths:
      - "docs/**"
      - "zensical.toml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zensical
        run: pip install zensical

      - name: Build documentation
        run: zensical build
