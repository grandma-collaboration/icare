repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.5.0
    hooks:
      - id: check-yaml
        exclude: mkdocs.yml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/python/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        pass_filenames: true
        exclude: baselayer|node_modules|static|extensions
